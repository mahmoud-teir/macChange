<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark background gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050A14;stop-opacity:1" />
    </radialGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Outer Glow for the M -->
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feFlood flood-color="#00F2FF" result="color" />
      <feComposite in="color" in2="blur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded Square -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bgGradient)" stroke="#1E293B" stroke-width="4" />

  <!-- Stylized M with circuit nodes -->
  <g filter="url(#outerGlow)">
    <!-- Main M Path -->
    <path d="M120,380 L120,132 L256,260 L392,132 L392,380" 
          fill="none" 
          stroke="#00F2FF" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Circuit Branches -->
    <path d="M120,200 L80,200" fill="none" stroke="#00F2FF" stroke-width="8" stroke-linecap="round" />
    <path d="M392,200 L432,200" fill="none" stroke="#00F2FF" stroke-width="8" stroke-linecap="round" />
    <path d="M256,260 L256,330" fill="none" stroke="#00F2FF" stroke-width="8" stroke-linecap="round" />

    <!-- Nodes (circles) -->
    <circle cx="120" cy="380" r="10" fill="#00F2FF" />
    <circle cx="120" cy="132" r="10" fill="#00F2FF" />
    <circle cx="256" cy="260" r="10" fill="#00F2FF" />
    <circle cx="392" cy="132" r="10" fill="#00F2FF" />
    <circle cx="392" cy="380" r="10" fill="#00F2FF" />
    <circle cx="80" cy="200" r="8" fill="#00F2FF" />
    <circle cx="432" cy="200" r="8" fill="#00F2FF" />
    <circle cx="256" cy="330" r="8" fill="#00F2FF" />
  </g>

  <!-- Subtle grid pattern (optional, for tech feel) -->
  <g opacity="0.1">
    <line x1="100" y1="20" x2="100" y2="492" stroke="#FFFFFF" stroke-width="1" />
    <line x1="200" y1="20" x2="200" y2="492" stroke="#FFFFFF" stroke-width="1" />
    <line x1="300" y1="20" x2="300" y2="492" stroke="#FFFFFF" stroke-width="1" />
    <line x1="400" y1="20" x2="400" y2="492" stroke="#FFFFFF" stroke-width="1" />
    <line x1="20" y1="100" x2="492" y2="100" stroke="#FFFFFF" stroke-width="1" />
    <line x1="20" y1="200" x2="492" y2="200" stroke="#FFFFFF" stroke-width="1" />
    <line x1="20" y1="300" x2="492" y2="300" stroke="#FFFFFF" stroke-width="1" />
    <line x1="20" y1="400" x2="492" y2="400" stroke="#FFFFFF" stroke-width="1" />
  </g>
</svg>
